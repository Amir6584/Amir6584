  journal: Scientific Reports
  title: EEG Glasses for Real-Time Brain Electrical Activity Monitoring
  year: '2025'
  highlight: 1
  image: eGlass2.png
  description:  In this work, we present e-Glass, a state-of-the-art smart wearable device that enables unobtrusive real-time electroencephalography (EEG) monitoring. Moreover, we present a lightweight edge-ML scheme tailored for e-Glass, which has limited resources (compute, memory, and energy). 
