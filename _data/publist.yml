- ENTRYTYPE: article
  ID: huang2509beft
  author: Huang, Baichuan and Balashankar, Ananth and Aminifar, Amir
  booktitle: Association for Computational Linguistics (ACL 2026)
  title: 'BEFT: Bias-Efficient Fine-Tuning of Language Models in Low-Data Regimes'
  year: '2026'
  highlight: 1
  image: BEFT.png
  description: In this paper, we propose an efficient PEFT scheme, in collaboration with Google DeepMind. BEFT fine-tunes only the bias terms in the value projection, making it an efficient PEFT (parameter-efficient fine-tuning) approach, and can also be combined with other PEFT schemes, e.g., LoRA. BEFT is also available on <a href="https://huggingface.co/docs/peft/main/en/package_reference/beft">Hugging Face</a>.
  link:
    url: https://arxiv.org/abs/2509.15974
    display: Association for Computational Linguistics (ACL) (2026)
    

- ENTRYTYPE: inproceedings
  ID: huang2025tinyfoa
  author: Huang, Baichuan and Aminifar, Amir
  booktitle: AAAI Conference on Artificial Intelligence (AAAI)
  title: 'TinyFoA: Memory Efficient Forward-Only Algorithm for On-Device Learning'
  year: '2025'
  highlight: 1
  image: TinyFoA.png
  description:  In this paper, we propose a memory-efficient forward-only algorithm called TinyFoA, to reduce dynamic memory overhead in the training process. Our TinyFoA optimizes the memory efficiency not only by layer-wise training but also by partially updating each layer, as well as by binarizing the weights and the activations. 
  link:
    url: https://ojs.aaai.org/index.php/AAAI/article/view/33910
    display: AAAI Conference on Artificial Intelligence (AAAI) (2025)

